services:
  backend:
    build:
      context: ./backend
      target: development
    container_name: cab-wawaku-backend
    ports:
      - "4000:4000"
      - "9100:9100"
    env_file:
      - backend/.env
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: cab-wawaku-frontend
    ports:
      - "5173:5173"
      - "80:80"
    environment:
      - VITE_API_URL=http://backend:4000
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - backend
    restart: always
    networks:
      - monitoring

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    pid: host
    volumes: 
      - '/:/host:ro'
    ports:
      - "9101:9100"
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./backend/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./backend/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./backend/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus

networks:
  monitoring:
    driver: bridge
